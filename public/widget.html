<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     WIDGET-ONLY BUILD
     This is the same chat launcher + panel as public/chatbot.html,
     with the landing page (hero, listings, testimonials, etc.)
     removed. It is meant to run INSIDE the small iframe that
     embed.js injects into a client's own website — not to be
     opened directly as a page.

     RE-BRAND HOOK — change these per client if their brand colors
     differ from the AssistQ defaults. Prefer doing this with the
     ?accent= / ?ink= URL params from embed.js instead of editing
     this file, so one file still serves every client.
     ============================================================ */
  :root {
    --ink: #14213d;
    --accent: #e2703a;
    --accent-2: #f0925f;
    --bg: #fdfaf6;
    --surface: #ffffff;
    --border: #eae4da;
    --bubble-bot: #f1ede6;
    --bubble-user: #14213d;
    --font-body: "Manrope", -apple-system, "Segoe UI", sans-serif;
    --accent-glow: rgba(226,112,58,0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* Positioned ABSOLUTE (not fixed) — this file only ever renders
     inside its own small iframe, and embed.js resizes that iframe
     itself, so the widget just fills whatever box it's given. */
  #launcher {
    position: absolute; bottom: 14px; right: 14px;
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; cursor: pointer; border: none;
    box-shadow: 0 10px 28px var(--accent-glow);
    transition: transform .2s ease;
  }
  #launcher::before {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0.5;
    animation: launcherPulse 2.6s ease-out infinite;
  }
  #launcher:hover { transform: scale(1.06); }
  @keyframes launcherPulse { 0%{ transform: scale(0.9); opacity: 0.6; } 100%{ transform: scale(1.35); opacity: 0; } }

  #panel {
    position: absolute; bottom: 14px; right: 14px;
    width: 360px; max-width: calc(100vw - 20px); height: calc(100vh - 20px); max-height: 640px;
    background: var(--bg); border-radius: 20px;
    box-shadow: 0 24px 60px -10px rgba(20,33,61,0.35);
    display: none; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border);
  }
  #panel.open { display: flex; animation: panelIn .25s ease; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  #header {
    background: linear-gradient(135deg, var(--ink), #1c2f57);
    color: white; padding: 18px; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  #header::before { content: "●"; color: #6adf8a; font-size: 9px; filter: drop-shadow(0 0 4px #6adf8a); }
  #header span { display: block; font-weight: 400; font-size: 12px; opacity: 0.65; margin-top: 3px; }
  #closeBtn { margin-left: auto; background: none; border: none; color: white; opacity: 0.75; font-size: 18px; cursor: pointer; line-height: 1; }
  #closeBtn:hover { opacity: 1; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 14px; line-height: 1.45; animation: msgIn .25s ease; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.bot { background: var(--bubble-bot); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(20,33,61,0.06); }
  .msg.user { background: linear-gradient(135deg, var(--bubble-user), #1c2f57); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.error { background: #fdecea; color: #a12622; align-self: flex-start; font-family: ui-monospace, monospace; font-size: 12px; }
  #inputRow { display: flex; padding: 12px; gap: 9px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  #textInput { flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 11px 15px; font-size: 14px; outline: none; font-family: var(--font-body); transition: border-color .15s ease; min-width: 0; }
  #textInput:focus { border-color: var(--accent); }
  #sendBtn { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: white; border: none; border-radius: 20px; padding: 0 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s ease; }
  #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

  .optionsRow { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; flex-shrink: 0; }
  .optionBtn {
    background: var(--surface); color: var(--ink); border: 1.5px solid var(--accent);
    border-radius: 16px; padding: 8px 15px; font-size: 13px; cursor: pointer;
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .optionBtn:hover { background: var(--accent); color: white; transform: translateY(-1px); }

  @media (max-width: 480px) {
    #panel { right: 10px; bottom: 10px; width: calc(100vw - 20px); }
  }
</style>
</head>
<body>

<button id="launcher">💬</button>

<div id="panel">
  <div id="header">
    <span id="headerTitle">Chat with us</span>
    <span id="subheader">Usually replies in a few seconds</span>
    <button id="closeBtn" title="Close">✕</button>
  </div>
  <div id="messages"></div>
  <div id="optionsContainer"></div>
  <div id="inputRow">
    <input id="textInput" type="text" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
// ============ CONFIG — everything here comes from the URL, set by embed.js ============
// This file is never edited per client. embed.js builds the iframe src with
// these params so one widget.html serves every client, same pattern as
// public/chatbot.html's ?clientId=&dashboardUrl= support.
const params = new URLSearchParams(window.location.search);
const CONFIG = {
  webhookUrl: "",
  dashboardUrl: (params.get("dashboardUrl") || "https://app.assistq.in").replace(/\/$/, ""),
  clientId: params.get("clientId") || "",
  businessName: params.get("businessName") || "This Business",
  greeting: "Hi! 👋 What's your name?",
  questions: [
    { key: "name",  options: null },
    { key: "phone", options: null },
    { key: "email", options: null },
    { key: "purpose", options: ["Buying", "Renting"] },
    { key: "location", options: null },
    { key: "configuration", options: ["1BHK", "2BHK", "3BHK", "4BHK"] },
    { key: "budget", options: ["Under ₹50L", "₹50L-1Cr", "₹1Cr-2Cr", "₹2Cr+"] },
    { key: "timeline", options: ["Immediately", "1-3 months", "3-6 months", "Just exploring"] }
  ]
};
if (!CONFIG.webhookUrl && CONFIG.dashboardUrl) CONFIG.webhookUrl = CONFIG.dashboardUrl + "/api/chatbot";

// Optional light re-brand via URL, e.g. &accent=%23c9573f&ink=%23150f04
const accent = params.get("accent");
const ink = params.get("ink");
if (accent) document.documentElement.style.setProperty("--accent", accent);
if (ink) document.documentElement.style.setProperty("--ink", ink);

if (!CONFIG.clientId) {
  document.body.innerHTML = "";
  console.warn("ASSISTQ widget: no clientId given in the embed snippet — nothing will render.");
}

function readUTM() {
  // The widget lives in an iframe, so UTM params are on the HOST page's URL,
  // not this iframe's URL. embed.js reads window.top's URL and forwards them
  // in as ?utm_source=&utm_medium=&utm_campaign= on THIS iframe's src instead.
  return {
    source: (params.get("utm_source") || "").trim(),
    medium: (params.get("utm_medium") || "").trim(),
    campaign: (params.get("utm_campaign") || "").trim()
  };
}
const utm = readUTM();

let conversation = [];
let knownFields = {};
let isComplete = false;
let awaitingLocalField = null;
const leadId = "lead_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);

const launcher = document.getElementById("launcher");
const panel = document.getElementById("panel");
const messagesEl = document.getElementById("messages");
const optionsContainer = document.getElementById("optionsContainer");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");
const closeBtn = document.getElementById("closeBtn");

// Tell the parent page (via embed.js) to resize the iframe so the panel
// isn't clipped, and so the rest of the host page stays clickable while
// the panel is closed.
function notifyParent(open) {
  window.parent.postMessage({ assistqWidget: true, open: !!open }, "*");
}

async function loadAssistQClientConfig(){
  if(!CONFIG.dashboardUrl || !CONFIG.clientId) return;
  try{
    const r=await fetch(CONFIG.dashboardUrl+"/api/public/client-config?clientId="+encodeURIComponent(CONFIG.clientId),{cache:"no-store"});
    if(!r.ok){ CONFIG.subscriptionActive=false; return; }
    const data=await r.json();
    CONFIG.subscriptionActive = data.subscription?.active !== false;
    if(!CONFIG.subscriptionActive) return;
    if(data.businessName) CONFIG.businessName=data.businessName;
    if(data.assistant?.name) document.getElementById("headerTitle").textContent = "Chat with " + data.assistant.name;
    if(data.assistant?.greeting) CONFIG.greeting=data.assistant.greeting;
    if(Array.isArray(data.assistant?.questions) && data.assistant.questions.length) CONFIG.questions=data.assistant.questions;
  }catch(e){ console.debug("ASSISTQ client config unavailable",e); }
}

async function openPanel() {
  panel.classList.add("open");
  notifyParent(true);
  if (conversation.length === 0) {
    await loadAssistQClientConfig();
    if (CONFIG.subscriptionActive === false) { addMessage("error", "This assistant is temporarily unavailable. Please contact the business."); return; }
    addMessage("bot", CONFIG.greeting);
    conversation.push({ role: "assistant", content: CONFIG.greeting });
    bridgeEvent("assistant", CONFIG.greeting);
    showOptionsIfAny();
  }
}
function closePanel() {
  panel.classList.remove("open");
  notifyParent(false);
}

launcher.addEventListener("click", () => {
  if (panel.classList.contains("open")) closePanel(); else openPanel();
});
closeBtn.addEventListener("click", closePanel);

sendBtn.addEventListener("click", () => sendMessage());
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

function addMessage(sender, text) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

const RENT_BUDGET_OPTIONS = ["Under ₹20k/mo", "₹20k–40k/mo", "₹40k–80k/mo", "₹80k+/mo"];
function optionsFor(q) {
  // The "budget" question means very different things for a renter vs a buyer —
  // once we know which, swap in the matching range instead of always showing
  // purchase-price buckets.
  if (q.key === "budget" && String(knownFields.purpose || "").toLowerCase().includes("rent")) {
    return RENT_BUDGET_OPTIONS;
  }
  return q.options;
}
function showOptionsIfAny() {
  optionsContainer.innerHTML = "";
  const nextQ = CONFIG.questions.find(q => !knownFields[q.key]);
  const opts = nextQ ? optionsFor(nextQ) : null;
  if (!nextQ || !opts || !opts.length) return;
  const row = document.createElement("div");
  row.className = "optionsRow";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "optionBtn";
    btn.textContent = opt;
    btn.onclick = () => sendMessage(opt);
    row.appendChild(btn);
  });
  optionsContainer.appendChild(row);
}

async function bridgeEvent(role, content) {
  if (!CONFIG.dashboardUrl) return;
  try {
    await fetch(CONFIG.dashboardUrl + "/api/bridge/conversation", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ leadId, event: { role, content, at: new Date().toISOString() }, fields: knownFields, utm, clientId: CONFIG.clientId, businessName: CONFIG.businessName }),
      keepalive: true
    });
  } catch (e) { console.debug("ASSISTQ dashboard bridge unavailable", e); }
}

async function bridgeLead() {
  if (!CONFIG.dashboardUrl) return;
  try {
    await fetch(CONFIG.dashboardUrl + "/api/bridge/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversationId: leadId, fields: knownFields, messages: conversation, utm, clientId: CONFIG.clientId, businessName: CONFIG.businessName }),
      keepalive: true
    });
  } catch (e) { console.debug("ASSISTQ dashboard lead bridge unavailable", e); }
}

async function submitLead() {
  if (CONFIG.subscriptionActive === false) { addMessage("error", "This assistant is temporarily unavailable. Please contact the business."); return; }
  await bridgeLead();
  try {
    const res = await fetch(CONFIG.webhookUrl, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ action: "submit", leadId, fields: knownFields, utm, clientId: CONFIG.clientId, businessName: CONFIG.businessName }) });
    const rawText = await res.text();
    let data; try { data = JSON.parse(rawText); } catch (e) { data = null; }
    if (!data || data.status !== "success") addMessage("error", "Lead submit failed: " + (data ? data.message : rawText.slice(0, 300)));
    else addMessage("bot", "✅ Saved! Thanks — we'll be in touch shortly.");
  } catch (err) { addMessage("error", "Submit request failed: " + err.message); }
}

async function sendMessage(optionText) {
  if (CONFIG.subscriptionActive === false) { addMessage("error", "This assistant is temporarily unavailable. Please contact the business."); return; }
  const text = optionText || textInput.value.trim();
  if (!text || isComplete) return;

  if (awaitingLocalField) {
    if (awaitingLocalField === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) { addMessage("error", "Please enter a valid email address."); return; }
    const field = awaitingLocalField;
    knownFields[field] = text;
    addMessage("user", text);
    conversation.push({ role: "user", content: text });
    bridgeEvent("user", text);
    textInput.value = "";
    awaitingLocalField = null;
    const missing = ["name", "phone", "email"].find(k => !String(knownFields[k] || "").trim());
    if (missing) {
      awaitingLocalField = missing;
      const prompt = missing === "email" ? "Before I save this enquiry, what is the best email address to reach you?" : `Before I save this enquiry, could you share your ${missing}?`;
      addMessage("bot", prompt); conversation.push({ role: "assistant", content: prompt }); bridgeEvent("assistant", prompt);
    } else {
      addMessage("bot", "Thanks! I have everything I need. Let me save your enquiry.");
      conversation.push({ role: "assistant", content: "Thanks! I have everything I need. Let me save your enquiry." });
      bridgeEvent("assistant", "Thanks! I have everything I need. Let me save your enquiry.");
      isComplete = true;
      await submitLead();
    }
    return;
  }

  optionsContainer.innerHTML = "";
  addMessage("user", text);
  conversation.push({ role: "user", content: text });
  bridgeEvent("user", text);
  textInput.value = "";
  sendBtn.disabled = true;
  const typingEl = addMessage("bot", "...");

  try {
    const res = await fetch(CONFIG.webhookUrl, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify({ action: "chat", leadId, messages: conversation, knownFields, clientId: CONFIG.clientId, dashboardUrl: CONFIG.dashboardUrl, businessName: CONFIG.businessName }) });
    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch (parseErr) {
      typingEl.remove(); addMessage("error", "Chat service returned an invalid response. Please contact the site administrator."); sendBtn.disabled = false; return;
    }
    if (data.status === "error") { typingEl.remove(); addMessage("error", "Backend error: " + data.message); sendBtn.disabled = false; return; }

    typingEl.remove();
    addMessage("bot", data.reply);
    conversation.push({ role: "assistant", content: data.reply });
    knownFields = data.fields || knownFields;
    bridgeEvent("assistant", data.reply);

    if (data.complete && !isComplete) {
      const missing = ["name", "phone", "email"].find(k => !String(knownFields[k] || "").trim());
      if (missing) {
        awaitingLocalField = missing;
        const prompt = missing === "email" ? "Before I save this enquiry, what is the best email address to reach you?" : `Before I save this enquiry, could you share your ${missing}?`;
        addMessage("bot", prompt); conversation.push({ role: "assistant", content: prompt }); bridgeEvent("assistant", prompt);
      } else { isComplete = true; await submitLead(); }
    } else { showOptionsIfAny(); }
  } catch (err) {
    typingEl.remove();
    addMessage("error", "Request failed: " + err.message + " (check the AssistQ backend connection and your internet connection)");
  }
  sendBtn.disabled = false;
  textInput.focus();
}

// Diagnostics — console only.
(function diagnostics() {
  const warn = (msg) => console.warn("%cASSISTQ widget:", "color:#e2703a;font-weight:bold", msg);
  if (!CONFIG.clientId) warn("No clientId set — add data-client=\"your-client-id\" to the embed.js <script> tag.");
})();
</script>
</body>
</html>
